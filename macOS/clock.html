<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 20px 24px 18px;
      color: rgba(255, 255, 255, 0.94);
      background-color: rgba(22, 24, 29, 0.94);
      background-image:
        radial-gradient(circle at 50% -25%, rgba(255, 255, 255, 0.12), transparent 55%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -20px 40px rgba(0, 0, 0, 0.08);
      transition:
        background-color 240ms ease,
        border-color 240ms ease,
        box-shadow 240ms ease;
    }

    body:active { cursor: grabbing; }

    body.backgrounded {
      background-color: rgba(22, 24, 29, 0.18);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -16px 32px rgba(0, 0, 0, 0.025);
    }

    header,
    #clock-grid {
      opacity: 1;
      transition: opacity 240ms ease;
    }

    body.backgrounded header,
    body.backgrounded #clock-grid {
      opacity: 0.72;
    }

    header {
      min-height: 30px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0 2px;
    }

    #clock-time {
      font: 600 21px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.82);
    }

    .legend {
      padding-top: 2px;
      color: rgba(255, 255, 255, 0.30);
      font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.1em;
    }

    body.hide-numbers #clock-time { visibility: hidden; }

    #clock-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      min-height: 0;
    }

    .unit {
      --accent: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 10px 12px 9px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
    }

    .unit.hours { --accent: #ffc857; }
    .unit.minutes { --accent: #55d5ee; }
    .unit.seconds { --accent: #ff7199; }

    .unit-title {
      color: color-mix(in srgb, var(--accent) 86%, white);
      font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.16em;
      text-align: center;
    }

    .stacks {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      min-height: 0;
      padding-top: 8px;
    }

    .stack {
      height: 100%;
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-start;
      gap: 4px;
    }

    .tens-stack { width: 50px; }
    .ones-stack { width: 16px; }

    .block {
      flex: 0 0 auto;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.27), transparent 42%),
        var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 65%, white);
      box-shadow:
        0 2px 5px color-mix(in srgb, var(--accent) 25%, transparent),
        inset 0 -2px 3px rgba(0, 0, 0, 0.16);
    }

    .ten-block {
      width: 50px;
      height: 17px;
      border-radius: 5px;
    }

    .one-block {
      width: 16px;
      height: 11px;
      border-radius: 3px;
    }

    .base {
      height: 3px;
      margin-top: 5px;
      border-radius: 3px;
      background: color-mix(in srgb, var(--accent) 32%, rgba(255, 255, 255, 0.10));
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 14%, transparent);
    }

    .new-block {
      animation: drop-in 220ms cubic-bezier(.2, .9, .3, 1.15);
    }

    .merged-block {
      animation: merge-in 320ms ease-out;
    }

    @keyframes drop-in {
      from { transform: translateY(-13px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes merge-in {
      0% { transform: scaleX(0.28); opacity: 0.35; }
      68% { transform: scaleX(1.08); opacity: 1; }
      100% { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <header>
    <time id="clock-time"></time>
    <div class="legend">10 BLOCK&nbsp;&nbsp;•&nbsp;&nbsp;1 BLOCK</div>
  </header>

  <main id="clock-grid" aria-label="ブロック時計">
    <section class="unit hours">
      <div class="unit-title">HOURS</div>
      <div class="stacks">
        <div class="stack tens-stack" data-stack="hours-tens"></div>
        <div class="stack ones-stack" data-stack="hours-ones"></div>
      </div>
      <div class="base"></div>
    </section>

    <section class="unit minutes">
      <div class="unit-title">MINUTES</div>
      <div class="stacks">
        <div class="stack tens-stack" data-stack="minutes-tens"></div>
        <div class="stack ones-stack" data-stack="minutes-ones"></div>
      </div>
      <div class="base"></div>
    </section>

    <section class="unit seconds">
      <div class="unit-title">SECONDS</div>
      <div class="stacks">
        <div class="stack tens-stack" data-stack="seconds-tens"></div>
        <div class="stack ones-stack" data-stack="seconds-ones"></div>
      </div>
      <div class="base"></div>
    </section>
  </main>

  <script>
    const twoDigit = value => String(value).padStart(2, "0");
    let previous = null;

    function fillStack(selector, count, type, animateNewest, merged) {
      const stack = document.querySelector(`[data-stack="${selector}"]`);
      stack.replaceChildren();

      for (let index = 0; index < count; index += 1) {
        const block = document.createElement("div");
        block.className = `block ${type}-block`;
        if (animateNewest && index === count - 1) {
          block.classList.add(merged ? "merged-block" : "new-block");
        }
        stack.append(block);
      }
    }

    function renderUnit(name, value, previousValue, maximum) {
      const incremented = previousValue !== null && value === (previousValue + 1) % (maximum + 1);
      const ones = value % 10;
      const tens = Math.floor(value / 10);
      const merged = incremented && ones === 0 && value !== 0;

      fillStack(`${name}-tens`, tens, "ten", merged, true);
      fillStack(`${name}-ones`, ones, "one", incremented && ones !== 0, false);
    }

    function updateClock() {
      const now = new Date();
      const current = {
        hours: now.getHours(),
        minutes: now.getMinutes(),
        seconds: now.getSeconds()
      };

      document.querySelector("#clock-time").textContent =
        `${twoDigit(current.hours)}:${twoDigit(current.minutes)}:${twoDigit(current.seconds)}`;

      renderUnit("hours", current.hours, previous?.hours ?? null, 23);
      renderUnit("minutes", current.minutes, previous?.minutes ?? null, 59);
      renderUnit("seconds", current.seconds, previous?.seconds ?? null, 59);
      previous = current;
    }

    function setNumberVisible(visible) {
      document.body.classList.toggle("hide-numbers", !visible);
    }

    function setBackgrounded(backgrounded) {
      document.body.classList.toggle("backgrounded", backgrounded);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
